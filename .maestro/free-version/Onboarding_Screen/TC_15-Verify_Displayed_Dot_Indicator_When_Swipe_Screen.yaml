appId: com.thmobile.logomaker
---

- runFlow: "../../config/Launch_App_Clear_State.yaml"

- runFlow: "../../config/Language_Screen/Tap_On_Language_Success.yaml"

- runFlow: "../../config/Close_Ads_Screen.yaml"

- assertVisible: "LogoX - AI Logo Maker"
- assertVisible: "Edit your design easily!"
- assertVisible: "Next"

- repeat:
    times: 2
    commands:
      - swipe:
          start: 90%, 50%
          end: 50%, 50%
          duration: 50
      - assertVisible:
          id: "dot"
      - assertVisible:
          id: "dot"
          index: 1
      - assertVisible:
          id: "dot"
          index: 2

      - swipe:
          start: 10%, 50%
          end: 50%, 50%
          duration: 50
      - assertVisible:
          id: "dot"
      - assertVisible:
          id: "dot"
          index: 1
      - assertVisible:
          id: "dot"
          index: 2