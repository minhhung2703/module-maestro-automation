appId: com.thmobile.logomaker
---

- runFlow: "../../config/Launch_App_Clear_State.yaml"

- runFlow: "../../config/Language_Screen/Tap_On_Language_Success.yaml"

- runFlow: "../../config/Close_Ads_Screen.yaml"

- repeat:
    times: 4
    commands:
      - swipe:
          start: 90%, 50%
          end: 50%, 50%
          duration: 50

- assertVisible:
    id: "img"
- assertVisible: "Create Logo Easily"
- assertVisible: "With Auto Design Tool"
- assertVisible: "Get Start"