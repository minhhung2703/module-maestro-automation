appId: com.thmobile.logomaker
---
- runFlow: "../../config/Launch_App_Clear_State.yaml"

- assertVisible: "Language"

- tapOn: "English"

- assertVisible:
    id: "checkbox"
    childOf:
      id: "rlItem"
      containsChild:
        text: "English"
    selected: true

- assertVisible:
    id: "btnOK"
    enabled: true
