appId: com.thmobile.logomaker
---
- runFlow: "../../config/Launch_App_Clear_State.yaml"

- assertVisible: "Language"

- tapOn: "English"

- assertVisible:
    id: "checkbox"
    childOf:
      id: "rlItem"
      containsChild: "English"
    selected: true

- tapOn:
    id: "btnOK"
    enabled: true

- assertVisible: "Test Ad"

- assertVisible:
    id: "image-only"


    
