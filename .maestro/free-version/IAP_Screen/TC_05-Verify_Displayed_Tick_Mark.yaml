appId: com.thmobile.logomaker
---

- runFlow: "../../config/Launch_App.yaml"

# Verify displayed IAP screen
- assertVisible: "Get Premium"
- assertVisible: "Unlock all Features"
- assertVisible:
    id: "rvAllFeatures"

# Verify tick marks in Free and PRO columns using AI
- assertWithAI:
    assertion: "In the feature comparison table: (1) Under the 'Free' column, checkmarks (✓) are displayed ONLY for the two rows 'Create own Logo' and 'Auto Design', while the other rows show a dash ('-'). (2) Under the 'PRO' column, checkmarks (✓) are displayed for all feature rows (Create own Logo, Auto Design, All Logo Templates, All Assets: Art, Background, Texture, No Ads, Get Updates)."