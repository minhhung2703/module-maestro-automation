appId: com.thmobile.logomaker
---

- runFlow: "../../config/Launch_App.yaml"

# Verify displayed IAP screen
- assertVisible: "Get Premium"
- assertVisible: "Unlock all Features"
- assertVisible:
    id: "rvAllFeatures"

# Verify Yearly Plan price and unit inside rbYearly
- tapOn:
    text: "$39.99"
    childOf:
      id: "tvYearlyPrice"

- assertVisible:
    id: "0_resource_name_obfuscated"
    index: -1

- back

- assertVisible:
    id: "rbYearly"
    checked: true
