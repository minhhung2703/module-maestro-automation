      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible: "Preview"
          commands:
            - back

- runFlow:
    when:
      visible: "Did you like this app?"
    commands:
      - back

# Step 16: Xác nhận đã trở lại màn hình Preview thành công sau khi lưu lại
- extendedWaitUntil:
