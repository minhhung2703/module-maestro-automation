appId: com.thmobile.logomaker
---
# ====================================================================
# TC_13_Test_Feature_Usage_And_Save_On_Edit_Screen
# Mục tiêu: Khởi động app > Vào Template Restaurant #1 > Màn Edit
#           > Sử dụng LẦN LƯỢT TẤT CẢ 6 CÔNG CỤ CHÍNH trên màn Edit:
#             1. Background Tool (Đổi màu nền Solid) -> Lưu PNG HD -> Preview 1
#             2. Art Tool (Dịch chuyển layer trên Canvas) -> Lưu PNG HD -> Preview 2
#             3. Text Tool (Tạo Text Frame mới "BEST FOOD") -> Lưu PNG HD -> Preview 3
#             4. Effect Tool (Áp dụng hiệu ứng phủ Texture) -> Lưu PNG HD -> Preview 4
#             5. Palette Tool (Đổi bộ phối màu Palette Theme) -> Lưu PNG HD -> Preview 5
#             6. Image Tool (Chèn ảnh từ Gallery thiết bị) -> Lưu PNG HD -> Preview 6
#             7. Save Project (Lưu dự án để sửa sau - Edit Later)
#           > Kết thúc: Thoát an toàn về màn hình chính Home Screen
# ====================================================================

# Step 1: Khởi động ứng dụng và đẩy ảnh mẫu vào thiết bị
- runFlow: "../config/Launch_App.yaml"

# Step 2: Đóng IAP nếu xuất hiện
- runFlow:
    when:
      visible:
        text: "Get Full Access"
    file: "../config/Close_IAP_Screen.yaml"

- runFlow:
    when:
      visible: "Skip the free trial?"
    file: "../config/Close_Skip_The_Free_Trial_Popup.yaml"

# Step 3: Điều hướng tới Template Detail (Restaurant #1)
- runFlow: "../config/Navigate_To_Restaurant_Edit.yaml"

# Step 4: Kiểm tra màn Edit đã sẵn sàng
- assertVisible:
    id: "mnItemSave"

- assertVisible:
    id: "layout_designer"

- takeScreenshot: "screenshots/TC_13_Edit_Screen_Initial"

# ====================================================================
# PHẦN 1: TÍNH NĂNG BACKGROUND TOOL (ĐỔI MÀU NỀN) & THỰC HIỆN LƯU LẠI
# ====================================================================

# Step 5: Mở công cụ Background và chọn màu nền mới
- tapOn:
    id: "itemBackground"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "Color"
    childOf:
      id: "layout_background_editor_menu"

- assertVisible: "Select Color"

# Chọn màu thứ 2 trong bảng màu Solid Color
- tapOn:
    id: "img"
    index: 1

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "mnItemSave"

- takeScreenshot: "screenshots/TC_13_Edit_After_Background"

# Step 6: Thực hiện Lưu và Xuất ảnh PNG HD lần 1 (Sau khi đổi Background)
- tapOn:
    id: "mnItemSave"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "llExportLogo"

- tapOn:
    id: "llExportLogo"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "Logo Size"

- tapOn:
    id: "layout_hd"

- tapOn:
    id: "tvSave"

# Step 7: Xử lý Ads và Popup sau lưu lần 1
- runFlow:
    when:
      visible: "Test Ad"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Reward granted"
          commands:
            - tapOn:
                point: 93%,7%
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible: "Preview"
          commands:
            - back

- runFlow:
    when:
      visible: "Did you like this app?"
    commands:
      - back

# Step 8: Xác minh màn Preview lần 1 (Hiển thị màu nền mới)
- extendedWaitUntil:
    visible: "Preview"
    timeout: 10000

- assertVisible: "Preview"
- assertVisible:
    id: "btnHome"
- assertVisible:
    id: "imageTransparentGrid"

- takeScreenshot: "screenshots/TC_13_Preview_After_Background"

# ====================================================================
# PHẦN 2: TÍNH NĂNG ART TOOL (DI CHUYỂN LAYER) & THỰC HIỆN LƯU LẠI
# ====================================================================

# Step 9: Quay lại màn Edit từ Preview 1
- tapOn:
    point: 8%,8%

- waitForAnimationToEnd:
    timeout: 2000

# Đóng Ads nếu có khi Back
- runFlow:
    when:
      notVisible:
        id: "mnItemSave"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible:
              id: "mnItemSave"
          commands:
            - back

# Step 10: Xác nhận trở lại màn Edit và thực hiện di chuyển layer Art
- extendedWaitUntil:
    visible:
      id: "mnItemSave"
    timeout: 10000

# Chọn layer trên Canvas
- tapOn:
    point: "50%, 40%"

- waitForAnimationToEnd:
    timeout: 2000

# Dịch chuyển layer xuống dưới 2 lần
- runFlow:
    when:
      visible:
        id: "imgMoveDown"
    commands:
      - tapOn:
          id: "imgMoveDown"
      - tapOn:
          id: "imgMoveDown"

- waitForAnimationToEnd:
    timeout: 1000

- takeScreenshot: "screenshots/TC_13_Edit_After_Art_Move"

# Step 11: Thực hiện Lưu và Xuất ảnh PNG HD lần 2 (Sau khi di chuyển Art)
- tapOn:
    id: "mnItemSave"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "llExportLogo"

- tapOn:
    id: "llExportLogo"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "Logo Size"

- tapOn:
    id: "layout_hd"

- tapOn:
    id: "tvSave"

# Step 12: Xử lý Ads và Popup sau lưu lần 2
- runFlow:
    when:
      visible: "Test Ad"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Reward granted"
          commands:
            - tapOn:
                point: 93%,7%
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible: "Preview"
          commands:
            - back

- runFlow:
    when:
      visible: "Did you like this app?"
    commands:
      - back

# Step 13: Xác minh màn Preview lần 2 (Hiển thị vị trí layer mới)
