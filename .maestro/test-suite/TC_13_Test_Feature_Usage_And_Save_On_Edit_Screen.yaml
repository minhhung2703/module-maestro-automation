- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: "mnItemSave"

# Step 36: Thoát khỏi màn Edit để trở về Home Screen
- back

# Xử lý dialog xác nhận thoát "Do you want to exit Logo Maker?" -> Bấm "Yes"
- runFlow:
    when:
      visible: "Do you want to exit Logo Maker?"
    commands:
      - tapOn:
          id: "btnYes"

- waitForAnimationToEnd:
    timeout: 3000

# Đóng Interstitial Ad nếu xuất hiện
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

# Đóng màn hình IAP nếu xuất hiện
- runFlow:
    when:
      visible:
        text: "Get Full Access"
    file: "../config/Close_IAP_Screen.yaml"

# # Nếu đang ở màn hình danh mục (Food & Drink / tvCategory), nhấn Navigate up để trở về Select Template
# - runFlow:
#     when:
#       visible:
#         id: "tvCategory"
#     commands:
#       - tapOn: "Navigate up"
#       - waitForAnimationToEnd:
#           timeout: 2000

# # Đóng tiếp Ad nếu có
# - runFlow:
#     when:
#       visible: "Close"
#     commands:
#       - tapOn: "Close"

# Trở về Home Screen từ các màn hình danh mục (Food & Drink -> Select Template -> Home)
- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - runFlow:
          when:
            visible: "Navigate up"
          commands:
            - tapOn: "Navigate up"
            - waitForAnimationToEnd:
                timeout: 2000

- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - runFlow:
          when:
            visible: "Navigate up"
          commands:
            - tapOn: "Navigate up"
            - waitForAnimationToEnd:
                timeout: 2000

# Dự phòng nếu vẫn chưa thấy Home Screen
- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 2000

# Đóng tiếp Ad nếu có sau khi bấm Navigate up
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

# Đóng tiếp IAP nếu có
- runFlow:
    when:
      visible:
        text: "Get Full Access"
    file: "../config/Close_IAP_Screen.yaml"

- extendedWaitUntil:
    visible:
      id: "btnTemplate"
    timeout: 10000

- assertVisible:
    id: "btnTemplate"

