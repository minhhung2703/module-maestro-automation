    id: "itemBackground"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "Color"
    childOf:
      id: "layout_background_editor_menu"

- assertVisible: "Select Color"

# Chọn ô màu thứ 2 (Màu Đỏ) trong bảng Solid Color
- tapOn:
    id: "img"
    index: 1

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "mnItemSave"

- takeScreenshot: "screenshots/TC_14_Edit_After_Color"

# Step 12: Thực hiện Lưu và Xuất ảnh PNG HD lần 2 (Solid Color)
- tapOn:
    id: "mnItemSave"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "llExportLogo"

- tapOn:
    id: "llExportLogo"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "Logo Size"

- tapOn:
    id: "layout_hd"

- tapOn:
    id: "tvSave"

# Step 13: Xử lý Ads và Popup sau lưu lần 2
- runFlow:
    when:
      visible: "Test Ad"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
