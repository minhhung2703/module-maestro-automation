# PHẦN 7: TÍNH NĂNG SAVE PROJECT (LƯU DỰ ÁN ĐỂ SỬA SAU - EDIT LATER)
# ====================================================================

# Step 41: Nhấn Save và chọn Save Project (Edit Later)
- tapOn:
    id: "mnItemSave"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "llSaveProject"

- tapOn:
    id: "llSaveProject"

- waitForAnimationToEnd:
    timeout: 3000

# Xử lý quảng cáo sau Save Project nếu có
- runFlow:
    when:
      visible: "Test Ad"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Close"
          commands:
