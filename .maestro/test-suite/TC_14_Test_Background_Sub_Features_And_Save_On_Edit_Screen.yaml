# Chọn ảnh đầu tiên trong Media Picker
- tapOn:
    text: "Photo taken.*"
    index: 0

- waitForAnimationToEnd:
    timeout: 2000

# Nhấn Done trên thanh công cụ của PhotoPicker
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"

- extendedWaitUntil:
    visible:
      id: "crop_image_menu_crop"
    timeout: 10000

# Xoay ảnh 90 độ và nhấn CROP
- tapOn:
    id: "ic_rotate_right_24"

- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
