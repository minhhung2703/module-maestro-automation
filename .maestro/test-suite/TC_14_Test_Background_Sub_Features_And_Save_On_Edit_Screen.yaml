appId: com.thmobile.logomaker
---
# ====================================================================
# TC_14_Test_Background_Sub_Features_And_Save_On_Edit_Screen
# Mục tiêu: Khởi động app > Vào Template Restaurant #1 > Màn Edit
#           > Khám phá và thực thi LẦN LƯỢT TỪNG TÍNH NĂNG CON của Background Tool:
#             1. Shape / Geometry (Đổi hình dạng Tam giác Triangle) -> Lưu PNG HD -> Preview 1 -> Back Edit
#             2. Sub-tab Color (Đổi màu nền Solid Color) -> Lưu PNG HD -> Preview 2 -> Back Edit
#             3. Sub-tab Gradient (Thiết lập màu chuyển sắc Custom Gradient) -> Lưu PNG HD -> Preview 3 -> Back Edit
#             4. Sub-tab Background (Chọn mẫu nền Preset Catalog) -> Lưu PNG HD -> Preview 4 -> Back Edit
#             5. Sub-tab Texture (Áp dụng chất liệu hoa văn phủ nền) -> Lưu PNG HD -> Preview 5 -> Back Edit
#             6. Sub-tab Image (Chèn ảnh máy & Xoay/Cắt CROP làm nền) -> Lưu PNG HD -> Preview 6 -> Back Edit
#             7. Save Project (Lưu dự án để sửa sau - Edit Later)
#           > Kết thúc: Thoát an toàn về màn hình chính Home Screen
# ====================================================================

# Step 1: Khởi động ứng dụng và đẩy ảnh mẫu vào thiết bị
- runFlow: "../config/Launch_App.yaml"

# Step 2: Đóng IAP nếu xuất hiện
- runFlow:
    when:
      visible:
        text: "Get Full Access"
    file: "../config/Close_IAP_Screen.yaml"

- runFlow:
    when:
      visible: "Skip the free trial?"
    file: "../config/Close_Skip_The_Free_Trial_Popup.yaml"

# Step 3: Điều hướng tới Template Detail (Restaurant #1)
- runFlow: "../config/Navigate_To_Restaurant_Edit.yaml"

# Step 4: Kiểm tra màn Edit đã sẵn sàng
- extendedWaitUntil:
    visible:
      id: "mnItemSave"
    timeout: 10000

- assertVisible:
    id: "layout_designer"

- takeScreenshot: "screenshots/TC_14_Edit_Screen_Initial"

# ====================================================================
# PHẦN 1: TÍNH NĂNG CON 1 - THAY ĐỔI HÌNH DẠNG KHUNG NỀN (GEOMETRY SHAPE)
# ====================================================================

# Step 5: Mở Background Tool và chọn Shape Tam giác (Triangle)
- tapOn:
    id: "itemBackground"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "imgShape"
    index: 3
    childOf:
      id: "rvShape"

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: "screenshots/TC_14_Edit_After_Shape_Triangle"

# Step 6: Thực hiện Lưu và Xuất ảnh PNG HD lần 1 (Shape Triangle)
- tapOn:
    id: "mnItemSave"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible:
    id: "llExportLogo"

- tapOn:
    id: "llExportLogo"

- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "Logo Size"

- tapOn:
    id: "layout_hd"

- tapOn:
    id: "tvSave"

# Step 7: Xử lý Ads và Popup sau lưu lần 1
- runFlow:
    when:
      visible: "Test Ad"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Reward granted"
          commands:
            - tapOn:
                point: 93%,7%
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible: "Preview"
          commands:
            - back

- runFlow:
    when:
      visible: "Did you like this app?"
    commands:
      - back

# Step 8: Xác minh màn Preview lần 1 (Hiển thị Shape Triangle)
- extendedWaitUntil:
    visible: "Preview"
    timeout: 10000

- assertVisible: "Preview"
- assertVisible:
    id: "btnHome"
- assertVisible:
    id: "imageTransparentGrid"

- takeScreenshot: "screenshots/TC_14_Preview_After_Shape_Triangle"

# Step 9: Quay lại màn Edit từ Preview 1
- tapOn:
    point: 8%,8%

- waitForAnimationToEnd:
    timeout: 2000

# Đóng Ads nếu có khi Back
- runFlow:
    when:
      notVisible:
        id: "mnItemSave"
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: "Close"
          commands:
            - tapOn: "Close"
      - tapOn:
          point: 93%,4%
      - runFlow:
          when:
            notVisible:
              id: "mnItemSave"
          commands:
            - back

# Step 10: Xác nhận trở lại màn Edit thành công
- extendedWaitUntil:
    visible:
      id: "mnItemSave"
    timeout: 10000

# ====================================================================
# PHẦN 2: TÍNH NĂNG CON 2 - ĐỔI MÀU NỀN ĐƠN SẮC (SOLID COLOR)
# ====================================================================

# Step 11: Mở Background Tool và chọn sub-tab Color
