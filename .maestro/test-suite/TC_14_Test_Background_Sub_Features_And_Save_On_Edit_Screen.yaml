# Step 42: Kết thúc an toàn và trở về Home Screen
- runFlow:
    when:
      visible:
        id: "btnHome"
    commands:
      - tapOn:
          id: "btnHome"

- runFlow:
    when:
      visible: "Navigate up"
    commands:
      - tapOn: "Navigate up"

# Xử lý dialog xác nhận thoát "Do you want to exit Logo Maker?" -> Bấm "Yes"
- runFlow:
    when:
      visible: "Do you want to exit Logo Maker?"
    commands:
      - runFlow:
          when:
            visible:
              id: "btnYes"
          commands:
            - tapOn:
                id: "btnYes"
      - runFlow:
          when:
            visible: "Yes"
          commands:
            - tapOn: "Yes"

- waitForAnimationToEnd:
    timeout: 3000

# Đóng Interstitial Ad nếu xuất hiện
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

# Đóng màn hình IAP nếu xuất hiện
- runFlow:
    when:
      visible:
        text: "Get Full Access"
    file: "../config/Close_IAP_Screen.yaml"

# Trở về Home Screen từ các màn hình danh mục (Food & Drink -> Select Template -> Home)
- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - runFlow:
          when:
            visible: "Navigate up"
          commands:
            - tapOn: "Navigate up"
            - waitForAnimationToEnd:
                timeout: 2000

- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - runFlow:
          when:
            visible: "Navigate up"
          commands:
            - tapOn: "Navigate up"
            - waitForAnimationToEnd:
                timeout: 2000

- runFlow:
    when:
      notVisible:
        id: "btnTemplate"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 2000

# Đóng tiếp Ad nếu có sau khi bấm Navigate up
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

# Đóng tiếp IAP nếu có
- runFlow:
    when:
      visible:
